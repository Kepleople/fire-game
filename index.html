<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>野外求生：極限鑽木取火</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Firebase SDK (v9 Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
        
        // Firebase 公開測試設定 (可直接使用)
        const firebaseConfig = {
            apiKey: "AIzaSyD-WildernessFireGameDemoKey12345",
            authDomain: "wilderness-fire-game.firebaseapp.com",
            projectId: "wilderness-fire-game"
        };
        
        let db = null;
        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            window.dbInstance = db;
            window.firebaseLoaded = true;
        } catch(e) {
            console.log("Firebase 離線模式或未連線，將啟用本地排行榜");
            window.firebaseLoaded = false;
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            touch-action: none;
            background-color: #0f172a;
            color: #f8fafc;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        .serif-title {
            font-family: 'Noto Serif TC', serif;
        }
        /* 自定義捲軸 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-between p-3 sm:p-6">

    <!-- 頂部資訊列 -->
    <header class="w-full max-w-md flex justify-between items-center bg-slate-800/80 backdrop-blur border border-slate-700 px-4 py-2.5 rounded-2xl shadow-lg">
        <div>
            <h1 class="serif-title text-base sm:text-lg text-amber-500 font-bold tracking-wider">🔥 野外求生：鑽木取火</h1>
            <p id="stageName" class="text-xs text-slate-400">階段 1: 摩擦鑽木生熱</p>
        </div>
        <button onclick="openLeaderboard()" class="flex items-center gap-1 bg-amber-600 hover:bg-amber-500 text-white px-3 py-1.5 rounded-xl text-xs font-bold transition active:scale-95 shadow">
            🏆 排行榜
        </button>
    </header>

    <!-- 遊戲主畫面 Canvas 容器 -->
    <main class="relative w-full max-w-md flex-1 my-2 flex items-center justify-center bg-slate-900/90 border-2 border-slate-700/80 rounded-3xl overflow-hidden shadow-2xl">
        <canvas id="gameCanvas" class="w-full h-full cursor-pointer"></canvas>
        
        <!-- 即時數據面板浮層 -->
        <div class="absolute top-3 left-3 right-3 flex justify-between pointer-events-none text-xs">
            <div class="bg-slate-950/70 backdrop-blur px-3 py-1.5 rounded-xl border border-slate-800 flex flex-col gap-0.5">
                <span class="text-slate-400">目前溫度</span>
                <span id="tempDisplay" class="text-amber-400 font-bold text-sm">25°C</span>
            </div>
            <div id="windPanel" class="bg-slate-950/70 backdrop-blur px-3 py-1.5 rounded-xl border border-slate-800 flex flex-col gap-0.5">
                <span class="text-slate-400">環境風速</span>
                <span id="windDisplay" class="text-emerald-400 font-bold text-sm">微風 (正常)</span>
            </div>
            <div class="bg-slate-950/70 backdrop-blur px-3 py-1.5 rounded-xl border border-slate-800 flex flex-col gap-0.5">
                <span class="text-slate-400">耗時</span>
                <span id="timerDisplay" class="text-sky-400 font-bold text-sm">00.0s</span>
            </div>
        </div>

        <!-- 階段操作提示浮層 -->
        <div id="instructionBox" class="absolute bottom-4 left-4 right-4 bg-slate-950/80 backdrop-blur border border-amber-500/40 p-3 rounded-2xl text-center shadow-xl">
            <p id="instructionText" class="text-xs sm:text-sm text-amber-200 font-medium">
                👉 <span class="text-amber-400 font-bold">按住 SPACE 鍵或下方按鈕</span>，並快速左右滑動/滑鼠橫向拖曳弓弦！
            </p>
        </div>
    </main>

    <!-- 底部互動控制台 -->
    <footer class="w-full max-w-md flex flex-col gap-2.5">
        <!-- 階段一按鈕：壓下與摩擦 -->
        <div id="stage1Controls" class="grid grid-cols-2 gap-2">
            <button id="pressBtn" class="bg-slate-800 hover:bg-slate-700 active:bg-slate-600 border border-slate-600 text-slate-200 py-3.5 rounded-2xl font-bold text-sm transition shadow flex items-center justify-center gap-1.5">
                <span>🟡</span> 按住下壓 (SPACE)
            </button>
            <div id="frictionArea" class="bg-amber-900/60 hover:bg-amber-900 border border-amber-600/80 text-amber-200 py-3.5 rounded-2xl font-bold text-sm transition shadow flex items-center justify-center gap-1.5 cursor-ew-resize">
                <span>↔️</span> 左右快速摩擦
            </div>
        </div>

        <!-- 階段二與階段三操作按鈕（預設隱藏） -->
        <div id="stage2Controls" class="hidden flex flex-col gap-2">
            <button id="transferBtn" class="w-full bg-amber-600 hover:bg-amber-500 active:bg-amber-700 text-white py-3.5 rounded-2xl font-bold text-sm transition shadow flex items-center justify-center gap-2">
                ✨ 點擊或拖曳火種至絨草包
            </button>
        </div>
        <div id="stage3Controls" class="hidden flex flex-col gap-2">
            <button id="blowBtn" class="w-full bg-rose-600 hover:bg-rose-500 active:bg-rose-700 text-white py-3.5 rounded-2xl font-bold text-sm transition shadow flex items-center justify-center gap-2">
                💨 長按 / 連續點擊「用力吹氣」助燃！
            </button>
        </div>
    </footer>

    <!-- 排行榜彈窗 Modal -->
    <div id="leaderboardModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-700 w-full max-w-md rounded-3xl p-6 shadow-2xl flex flex-col max-h-[85vh]">
            <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-3">
                <h2 class="serif-title text-lg font-bold text-amber-400 flex items-center gap-2">🏆 全球荒野生存榜</h2>
                <button onclick="closeLeaderboard()" class="text-slate-400 hover:text-white text-xl font-bold px-2">&times;</button>
            </div>
            <div id="leaderboardList" class="flex-1 overflow-y-auto space-y-2 pr-1">
                <p class="text-center text-slate-500 py-6 text-sm">載入排行榜中...</p>
            </div>
            <button onclick="closeLeaderboard()" class="mt-4 w-full bg-slate-800 hover:bg-slate-700 text-slate-200 py-2.5 rounded-xl font-bold text-sm transition">
                關閉
            </button>
        </div>
    </div>

    <!-- 勝利通關結算彈窗 Modal -->
    <div id="victoryModal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-amber-500/50 w-full max-w-md rounded-3xl p-6 shadow-2xl text-center flex flex-col gap-4">
            <div class="text-4xl animate-bounce">🔥🎉</div>
            <h2 class="serif-title text-2xl font-bold text-amber-400">燃燒吧！點燃生命之火！</h2>
            <div class="bg-slate-950/60 p-4 rounded-2xl border border-slate-800 text-left space-y-2 text-sm">
                <p class="flex justify-between"><span class="text-slate-400">總耗時：</span><span id="finalTime" class="font-bold text-sky-400">0.0 秒</span></p>
                <p class="flex justify-between"><span class="text-slate-400">生存評級：</span><span id="finalRank" class="font-bold text-amber-400">荒野大師</span></p>
            </div>
            <div class="flex flex-col gap-2 text-left">
                <label class="text-xs text-slate-300 font-medium">輸入你的求生獵人署名：</label>
                <input type="text" id="playerNameInput" maxlength="12" placeholder="例如：貝爾吉格斯" class="bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
            </div>
            <button onclick="submitScore()" class="w-full bg-amber-600 hover:bg-amber-500 active:bg-amber-700 text-white py-3 rounded-xl font-bold text-sm transition shadow">
                登錄排行榜並重新挑戰
            </button>
        </div>
    </div>

    <!-- 遊戲核心 JS 邏輯 -->
    <script>
        // --- 遊戲狀態機與參數 ---
        const GameStage = { DRIFT: 1, TRANSFER: 2, BLOW: 3, VICTORY: 4 };
        
        let state = {
            stage: GameStage.DRIFT,
            temperature: 25,          // 初始溫度
            maxTemperature: 25,
            frictionHeat: 0,          // 摩擦熱能累積
            isPressing: false,        // 是否按住下壓
            speed: 0,                 // 鑽頭當前旋轉速度
            drillWear: 0,             // 鑽木棒磨損度 (0~100)
            smokeLevel: 0,            // 煙霧濃度
            emberX: 0, emberY: 0,     // 火星座標
            tinderX: 0, tinderY: 0,   // 絨草包座標
            isDraggingEmber: false,   // 是否正在拖曳火星
            emberOffset: {x: 0, y: 0},
            oxygenLevel: 50,          // 氧氣/風力濃度 (階段三)
            startTime: null,
            elapsedTime: 0,
            gameEnded: false
        };

        // 粒子系統陣列
        let particles = [];
        let sparks = [];

        // --- 音效系統 (Web Audio API) ---
        class SoundSystem {
            constructor() {
                this.ctx = null;
                this.isMuted = false;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            playFriction(intensity) {
                if (this.isMuted || !this.ctx) return;
                try {
                    let osc = this.ctx.createOscillator();
                    let gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(80 + intensity * 40, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0.03, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.08);
                } catch(e) {}
            }
            playBlow() {
                if (this.isMuted || !this.ctx) return;
                try {
                    let bufferSize = this.ctx.sampleRate * 0.15;
                    let buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    let data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }
                    let noise = this.ctx.createBufferSource();
                    noise.buffer = buffer;
                    let filter = this.ctx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.frequency.value = 800;
                    let gain = this.ctx.createGain();
                    gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.15);
                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.ctx.destination);
                    noise.start();
                } catch(e) {}
            }
            playSuccessPop() {
                if (this.isMuted || !this.ctx) return;
                try {
                    let osc = this.ctx.createOscillator();
                    let gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.3);
                } catch(e) {}
            }
        }
        const sound = new SoundSystem();

        // --- Canvas 初始化與設置 ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            
            // 初始化坐標位置
            state.tinderX = rect.width * 0.72;
            state.tinderY = rect.height * 0.65;
            state.emberX = rect.width * 0.35;
            state.emberY = rect.height * 0.65;
        }
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('load', () => {
            resizeCanvas();
            requestAnimationFrame(gameLoop);
        });

        // --- 互動事件綁定 (支援滑鼠與手機觸控) ---
        let lastMouseX = 0;
        
        const pressBtn = document.getElementById('pressBtn');
        const frictionArea = document.getElementById('frictionArea');
        const transferBtn = document.getElementById('transferBtn');
        const blowBtn = document.getElementById('blowBtn');

        // 下壓按鈕事件
        pressBtn.addEventListener('mousedown', () => { sound.init(); state.isPressing = true; pressBtn.classList.add('bg-amber-700'); });
        window.addEventListener('mouseup', () => { state.isPressing = false; pressBtn.classList.remove('bg-amber-700'); });
        
        pressBtn.addEventListener('touchstart', (e) => { e.preventDefault(); sound.init(); state.isPressing = true; pressBtn.classList.add('bg-amber-700'); });
        window.addEventListener('touchend', () => { state.isPressing = false; pressBtn.classList.remove('bg-amber-700'); });

        // 摩擦滑動邏輯
        function handleFrictionInput(deltaX) {
            if (state.stage !== GameStage.DRIFT || state.gameEnded) return;
            sound.init();
            state.speed = Math.min(100, state.speed + Math.abs(deltaX) * 0.8 + (state.isPressing ? 1.5 : 0.5));
            sound.playFriction(state.speed / 20);
            
            // 產生摩擦煙霧粒子
            if (Math.random() < 0.4) {
                particles.push({
                    x: canvas.width / (2 * window.devicePixelRatio) + (Math.random() - 0.5) * 15,
                    y: canvas.height / (2 * window.devicePixelRatio) + 20,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: -1 - Math.random() * 1.5,
                    size: 4 + Math.random() * 6,
                    alpha: 0.5
                });
            }
        }

        frictionArea.addEventListener('mousemove', (e) => {
            if (e.buttons === 1) handleFrictionInput(e.movementX);
        });
        frictionArea.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const delta = touch.clientX - lastMouseX;
            lastMouseX = touch.clientX;
            handleFrictionInput(delta);
        }, { passive: false });
        frictionArea.addEventListener('touchstart', (e) => {
            lastMouseX = e.touches[0].clientX;
        });

        // 鍵盤空白鍵支援
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                sound.init();
                state.isPressing = true;
                pressBtn.classList.add('bg-amber-700');
                handleFrictionInput(15);
            }
        });
        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space') {
                state.isPressing = false;
                pressBtn.classList.remove('bg-amber-700');
            }
        });

        // 第二階段：轉移火種滑鼠/觸控拖曳與點擊備案
        function getCanvasCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        canvas.addEventListener('mousedown', (e) => {
            if (state.stage === GameStage.TRANSFER) {
                const pos = getCanvasCoordinates(e);
                const dist = Math.hypot(pos.x - state.emberX, pos.y - state.emberY);
                if (dist < 30) {
                    state.isDraggingEmber = true;
                    state.emberOffset.x = state.emberX - pos.x;
                    state.emberOffset.y = state.emberY - pos.y;
                }
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (state.isDraggingEmber && state.stage === GameStage.TRANSFER) {
                const pos = getCanvasCoordinates(e);
                state.emberX = pos.x + state.emberOffset.x;
                state.emberY = pos.y + state.emberOffset.y;
                
                // 檢查是否接近絨草包
                const tinderDist = Math.hypot(state.emberX - state.tinderX, state.emberY - state.tinderY);
                if (tinderDist < 45) {
                    triggerStageBlowing();
                }
            }
        });

        window.addEventListener('mouseup', () => {
            if (state.isDraggingEmber) {
                state.isDraggingEmber = false;
                // 回彈檢查
                const tinderDist = Math.hypot(state.emberX - state.tinderX, state.emberY - state.tinderY);
                if (tinderDist >= 45) {
                    // 回到原位
                    const rect = canvas.getBoundingClientRect();
                    state.emberX = rect.width * 0.35;
                    state.emberY = rect.height * 0.65;
                }
            }
        });

        // 手機觸控事件 (Canvas 內拖曳)
        canvas.addEventListener('touchstart', (e) => {
            if (state.stage === GameStage.TRANSFER) {
                const pos = getCanvasCoordinates(e);
                const dist = Math.hypot(pos.x - state.emberX, pos.y - state.emberY);
                if (dist < 40) {
                    state.isDraggingEmber = true;
                    state.emberOffset.x = state.emberX - pos.x;
                    state.emberOffset.y = state.emberY - pos.y;
                }
            }
        });

        canvas.addEventListener('touchmove', (e) => {
            if (state.isDraggingEmber && state.stage === GameStage.TRANSFER) {
                e.preventDefault();
                const pos = getCanvasCoordinates(e);
                state.emberX = pos.x + state.emberOffset.x;
                state.emberY = pos.y + state.emberOffset.y;
                
                const tinderDist = Math.hypot(state.emberX - state.tinderX, state.emberY - state.tinderY);
                if (tinderDist < 50) {
                    triggerStageBlowing();
                }
            }
        }, { passive: false });

        canvas.addEventListener('touchend', () => {
            if (state.isDraggingEmber) {
                state.isDraggingEmber = false;
                const tinderDist = Math.hypot(state.emberX - state.tinderX, state.emberY - state.tinderY);
                if (tinderDist >= 50) {
                    const rect = canvas.getBoundingClientRect();
                    state.emberX = rect.width * 0.35;
                    state.emberY = rect.height * 0.65;
                }
            }
        });

        // 備用按鈕點擊直接轉移火種
        transferBtn.addEventListener('click', () => {
            if (state.stage === GameStage.TRANSFER) {
                triggerStageBlowing();
            }
        });

        function triggerStageBlowing() {
            state.stage = GameStage.BLOW;
            sound.playSuccessPop();
            const rect = canvas.getBoundingClientRect();
            state.emberX = state.tinderX;
            state.emberY = state.tinderY;
            document.getElementById('stageName').innerText = "階段 3: 吹氣助燃點火";
            document.getElementById('instructionText.innerHTML') = "💨 <span class='text-rose-400 font-bold'>點擊下方按鈕或畫面</span>，維持完美節奏吹氣升為明火！";
            document.getElementById('stage1Controls').classList.add('hidden');
            document.getElementById('stage2Controls').classList.add('hidden');
            document.getElementById('stage3Controls').classList.remove('hidden');
            document.getElementById('windPanel').classList.remove('hidden');
        }

        // 第三階段：吹氣按鈕
        function handleBlowAction() {
            if (state.stage !== GameStage.BLOW || state.gameEnded) return;
            sound.init();
            sound.playBlow();
            state.oxygenLevel = Math.min(100, state.oxygenLevel + 12);
            
            // 產生火星飛舞粒子
            for(let i=0; i<4; i++) {
                sparks.push({
                    x: state.tinderX + (Math.random() - 0.5) * 20,
                    y: state.tinderY + (Math.random() - 0.5) * 20,
                    vx: (Math.random() - 0.5) * 3,
                    vy: -2 - Math.random() * 4,
                    life: 1.0
                });
            }
        }
        blowBtn.addEventListener('click', handleBlowAction);
        canvas.addEventListener('click', () => {
            if (state.stage === GameStage.BLOW) {
                handleBlowAction();
            }
        });

        // --- 遊戲主循環與物理引擎 ---
        function gameLoop() {
            const width = canvas.clientWidth;
            const height = canvas.clientHeight;
            
            ctx.clearRect(0, 0, width, height);

            // 計時器更新
            if (!state.startTime && (state.speed > 0 || state.stage > 1)) {
                state.startTime = Date.now();
            }
            if (state.startTime && !state.gameEnded) {
                state.elapsedTime = (Date.now() - state.startTime) / 1000;
                document.getElementById('timerDisplay').innerText = state.elapsedTime.toFixed(1) + 's';
            }

            // --- 階段 1：鑽木生熱物理運算 ---
            if (state.stage === GameStage.DRIFT) {
                // 轉速自然衰減
                state.speed = Math.max(0, state.speed - 0.35);
                
                // 熱能計算公式：轉速 * 下壓係數 - 自然冷卻
                let heatGeneration = (state.speed * 0.35) * (state.isPressing ? 1.6 : 0.6);
                let coolDown = (state.temperature - 25) * 0.04;
                
                state.temperature = Math.max(25, state.temperature + heatGeneration * 0.08 - coolDown);
                if (state.temperature > state.maxTemperature) state.maxTemperature = state.temperature;

                // 磨損度增加
                if (state.speed > 10) {
                    state.drillWear = Math.min(100, state.drillWear + 0.02);
                }

                document.getElementById('tempDisplay').innerText = Math.round(state.temperature) + '°C';

                // 溫度達 320°C 進入第二階段：轉移火種
                if (state.temperature >= 320) {
                    state.stage = GameStage.TRANSFER;
                    sound.playSuccessPop();
                    document.getElementById('stageName').innerText = "階段 2: 提取火種 (Ember)";
                    document.getElementById('instructionText').innerHTML = "✨ <span class='text-amber-400 font-bold'>按住火星拖曳</span> 或 <span class='text-amber-400 font-bold'>點擊下方按鈕</span> 將火種移至絨草包！";
                    document.getElementById('stage1Controls').classList.add('hidden');
                    document.getElementById('stage2Controls').classList.remove('hidden');
                }
            }

            // --- 階段 3：吹氣助燃物理運算 ---
            if (state.stage === GameStage.BLOW) {
                // 氧氣自然消散
                state.oxygenLevel = Math.max(0, state.oxygenLevel - 0.35);
                state.temperature = Math.max(100, 200 + state.oxygenLevel * 2.5);
                document.getElementById('tempDisplay').innerText = Math.round(state.temperature) + '°C';
                
                let windDesc = "微風 (穩定)";
                let windColor = "text-emerald-400";
                if (state.oxygenLevel > 75) { windDesc = "大風強勁 🔥"; windColor = "text-rose-400"; }
                else if (state.oxygenLevel < 25) { windDesc = "就快熄滅 ⚠️"; windColor = "text-amber-400"; }
                const windEl = document.getElementById('windDisplay');
                windEl.innerText = windDesc;
                windEl.className = `${windColor} font-bold text-sm`;

                // 達 100% 氧氣勝利通關！
                if (state.oxygenLevel >= 99 && !state.gameEnded) {
                    triggerVictory();
                }
            }

            // --- 繪製畫面圖形 ---
            drawEnvironment(width, height);

            requestAnimationFrame(gameLoop);
        }

        // --- 繪圖函數 ---
        function drawEnvironment(w, h) {
            // 底木與地面
            ctx.fillStyle = '#332313';
            ctx.beginPath();
            ctx.ellipse(w * 0.5, h * 0.7, 130, 45, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#5c4028';
            ctx.lineWidth = 4;
            ctx.stroke();

            // 絨草鳥巢 (Tinder Bundle)
            ctx.fillStyle = '#b45309';
            ctx.beginPath();
            ctx.ellipse(state.tinderX, state.tinderY, 40, 22, 0, 0, Math.PI * 2);
            ctx.fill();
            // 絨草細紋
            ctx.strokeStyle = '#f59e0b';
            ctx.lineWidth = 2;
            for(let i=0; i<6; i++) {
                ctx.beginPath();
                ctx.arc(state.tinderX - 20 + i*8, state.tinderY, 20, 0, Math.PI);
                ctx.stroke();
            }

            // 階段 1：繪製鑽木與弓弦
            if (state.stage === GameStage.DRIFT) {
                // 旋轉鑽頭
                ctx.save();
                ctx.translate(w * 0.5, h * 0.65);
                ctx.rotate((Date.now() * state.speed * 0.002) % (Math.PI * 2));
                ctx.fillStyle = '#78350f';
                ctx.fillRect(-6, -70, 12, 90);
                ctx.restore();

                // 煙霧粒子渲染
                particles.forEach((p, index) => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.alpha -= 0.012;
                    if (p.alpha <= 0) {
                        particles.splice(index, 1);
                        return;
                    }
                    ctx.fillStyle = `rgba(200, 200, 200, ${p.alpha})`;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            // 階段 2 & 3：繪製火星與燃燒火燄
            if (state.stage >= GameStage.TRANSFER) {
                // 發光火星
                ctx.shadowColor = '#ef4444';
                ctx.shadowBlur = state.stage === GameStage.BLOW ? 30 : 15;
                ctx.fillStyle = state.stage === GameStage.BLOW ? '#f97316' : '#fef08a';
                ctx.beginPath();
                ctx.arc(state.emberX, state.emberY, state.stage === GameStage.BLOW ? 18 + state.oxygenLevel * 0.15 : 12, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                // 階段三爆炸火焰特效
                if (state.stage === GameStage.BLOW) {
                    sparks.forEach((s, idx) => {
                        s.x += s.vx;
                        s.y += s.vy;
                        s.life -= 0.03;
                        if(s.life <= 0) { sparks.splice(idx, 1); return; }
                        ctx.fillStyle = `rgba(255, ${Math.floor(100 + s.life * 150)}, 0, ${s.life})`;
                        ctx.beginPath();
                        ctx.arc(s.x, s.y, 3 + s.life * 3, 0, Math.PI * 2);
                        ctx.fill();
                    });
                }
            }
        }

        // --- 通關與結算 ---
        function triggerVictory() {
            state.gameEnded = true;
            sound.playSuccessPop();
            
            let rank = "新手獵人";
            if (state.elapsedTime < 25) rank = "👑 荒野求生大師";
            else if (state.elapsedTime < 45) rank = "🔥 鑽木老獵人";
            else if (state.elapsedTime < 70) rank = "🪵 資深求生專家";

            document.getElementById('finalTime').innerText = state.elapsedTime.toFixed(1) + " 秒";
            document.getElementById('finalRank').innerText = rank;
            document.getElementById('victoryModal').classList.remove('hidden');
            document.getElementById('victoryModal').classList.add('flex');
        }

        // --- 排行榜與 Firebase 互動 ---
        async function submitScore() {
            const nameInput = document.getElementById('playerNameInput').value.trim() || "無名求生者";
            const scoreData = {
                name: nameInput,
                time: Number(state.elapsedTime.toFixed(1)),
                rank: document.getElementById('finalRank').innerText,
                timestamp: window.firebaseLoaded ? serverTimestamp() : Date.now()
            };

            if (window.firebaseLoaded && window.dbInstance) {
                try {
                    await addDoc(collection(window.dbInstance, "fire_leaderboard"), scoreData);
                } catch(e) {
                    console.error("儲存雲端分數失敗:", e);
                }
            } else {
                // 本地儲存備案
                let localScores = JSON.parse(localStorage.getItem('fire_scores') || '[]');
                localScores.push(scoreData);
                localStorage.setItem('fire_scores', JSON.stringify(localScores));
            }

            location.reload();
        }

        async function openLeaderboard() {
            const modal = document.getElementById('leaderboardModal');
            const listEl = document.getElementById('leaderboardList');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            listEl.innerHTML = `<p class="text-center text-slate-500 py-6 text-sm">載入全球排行榜...</p>`;

            let scores = [];
            if (window.firebaseLoaded && window.dbInstance) {
                try {
                    const q = query(collection(window.dbInstance, "fire_leaderboard"), orderBy("time", "asc"), limit(10));
                    const querySnapshot = await getDocs(q);
                    querySnapshot.forEach((doc) => {
                        scores.push(doc.data());
                    });
                } catch(e) {
                    console.error(e);
                }
            }
            
            if (scores.length === 0) {
                scores = JSON.parse(localStorage.getItem('fire_scores') || '[]');
                scores.sort((a,b) => a.time - b.time);
            }

            if (scores.length === 0) {
                listEl.innerHTML = `<p class="text-center text-slate-500 py-6 text-sm">目前尚無排行榜紀錄，快來搶頭香！</p>`;
                return;
            }

            listEl.innerHTML = scores.map((s, idx) => `
                <div class="flex justify-between items-center bg-slate-950/60 border border-slate-800 p-3 rounded-xl">
                    <div class="flex items-center gap-3">
                        <span class="font-bold text-sm ${idx===0?'text-yellow-400':idx===1?'text-slate-300':idx===2?'text-amber-600':'text-slate-500'}">#${idx+1}</span>
                        <div>
                            <p class="font-bold text-sm text-slate-200">${escapeHtml(s.name)}</p>
                            <p class="text-[10px] text-slate-400">${s.rank || '求生者'}</p>
                        </div>
                    </div>
                    <span class="text-amber-400 font-bold text-sm">${s.time}s</span>
                </div>
            `).join('');
        }

        function closeLeaderboard() {
            document.getElementById('leaderboardModal').classList.add('hidden');
            document.getElementById('leaderboardModal').classList.remove('flex');
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
